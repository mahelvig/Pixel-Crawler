<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Pixel Crawler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#181425">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Crawler">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --background: #181425; color-scheme: dark; }
  html { height: 100%; box-sizing: border-box; overflow: hidden; }
  body { height: 100%; }
  body { margin: 0; background: var(--background); overflow: hidden; display: grid; place-items: center; }
  canvas { display: block; image-rendering: crisp-edges; image-rendering: pixelated; cursor: none; touch-action: none; }
  canvas:focus { outline: none; }
  html, body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100dvh; }
  #rotate { display: none; position: fixed; inset: 0; background: var(--background); color: #c0cbdc; font: 16px monospace; text-align: center; align-items: center; justify-content: center; z-index: 5; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
<div id="rotate">Turn your phone sideways to play</div>
<canvas id="screen" width="320" height="180" tabindex="0" aria-label="Pixel Crawler"></canvas>

<script>
  // works offline and can be installed (only over http/https, not when the file is opened directly)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
